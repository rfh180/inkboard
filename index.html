<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="InkBoard">
<meta name="format-detection" content="telephone=no">
<title>InkBoard</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --bg: #fff; --fg: #000; --dim: #5a5a5a; --faint: #d0d0d0; --line: #000; --shade: #f1f1f1; }
  body.night { --bg: #000; --fg: #fff; --dim: #a8a8a8; --faint: #3a3a3a; --line: #fff; --shade: #161616; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  input, select, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-appearance: none; }
  [data-act], [data-hold] { cursor: pointer; }
  .hide { display: none !important; }

  /* ---------- frame ---------- */
  #app { position: absolute; left: 0; top: 0; right: 0; height: 100%; display: -webkit-flex; display: flex;
         -webkit-flex-direction: column; flex-direction: column; padding: 12px 14px 8px; }
  #hdr { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-bottom: 3px solid var(--line);
         padding: 0 2px 8px; margin-bottom: 10px; min-height: 40px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #hdr .nm { font-weight: 800; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; margin-right: 14px; }
  #hdr .cds { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; overflow: hidden; }
  #hdr .cd { border: 2px solid var(--line); border-radius: 18px; padding: 3px 12px; font-size: 16px; font-weight: 700; margin: 0 4px; white-space: nowrap; }
  #hdr .cd b { font-weight: 800; }
  #hdr .cd.today { background: var(--fg); color: var(--bg); }
  #hdr .tm { font-size: 22px; font-weight: 800; white-space: nowrap; margin-left: 14px; font-variant-numeric: tabular-nums; }
  #hdr .tm small { font-size: 14px; margin-left: 2px; }

  #pager { -webkit-flex: 1; flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #track { position: absolute; left: 0; top: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-transition: -webkit-transform .3s ease; transition: transform .3s ease; }
  #track.drag { -webkit-transition: none; transition: none; }
  .page { height: 100%; overflow: hidden; position: relative; }
  .page > .inner { height: 100%; }

  #bar { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-top: 3px solid var(--line);
         padding-top: 8px; margin-top: 10px; min-height: 52px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #bar .side { width: 30%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #bar .side.r { -webkit-justify-content: flex-end; justify-content: flex-end; }
  #bar .upd { color: var(--dim); font-size: 14px; margin-right: 12px; white-space: nowrap; }
  #bar .upd.off { color: var(--fg); font-weight: 700; }
  #dots { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center;
          -webkit-align-items: center; align-items: center; height: 44px; position: relative; }
  #dots .dot { width: 44px; height: 44px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #dots .dot i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--fg); }
  #dots .dot.on i { background: var(--fg); }
  #dots .holdbar { position: absolute; left: 50%; bottom: -2px; height: 4px; width: 0; background: var(--fg); -webkit-transform: translateX(-50%); transform: translateX(-50%); }
  #dots .holdtip { position: absolute; bottom: 46px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); background: var(--fg); color: var(--bg);
                   padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .btn { display: inline-block; border: 2px solid var(--line); border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 17px; line-height: 1.2; white-space: nowrap; }
  .btn.sm { padding: 5px 11px; font-size: 15px; }
  .btn.pri { background: var(--fg); color: var(--bg); }
  .btn.warn { border-style: dashed; }
  .btn:active, .btn.pressed { background: var(--fg); color: var(--bg); }
  .btn.pri:active { background: var(--bg); color: var(--fg); }

  /* ---------- layout pieces ---------- */
  .row { display: -webkit-flex; display: flex; height: 100%; }
  .colm { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; min-height: 0; }
  .colm + .colm { margin-left: 14px; }
  .grow { -webkit-flex: 1; flex: 1; min-height: 0; }
  .panel { border: 3px solid var(--line); border-radius: 10px; overflow: hidden; display: -webkit-flex; display: flex;
           -webkit-flex-direction: column; flex-direction: column; min-height: 0; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .panel + .panel, .clock + .panel { margin-top: 12px; }
  .panel.grow { -webkit-flex: 1; flex: 1; -webkit-flex-shrink: 1; flex-shrink: 1; }
  .tbar { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: var(--fg); color: var(--bg);
          padding: 6px 8px 6px 12px; font-size: 16px; min-height: 42px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .tbar b { text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbar .sub { -webkit-flex: 1; flex: 1; margin-left: 10px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbar .add { border: 2px solid var(--bg); border-radius: 7px; padding: 4px 12px; font-weight: 700; margin-left: 8px; white-space: nowrap; }
  .tbar .add:active { background: var(--bg); color: var(--fg); }
  .pbody { padding: 8px 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; -webkit-flex: 1; flex: 1; }
  .muted { color: var(--dim); }
  .none { color: var(--dim); font-size: 16px; padding: 6px 0; }
  .warn { border: 2px dashed var(--line); border-radius: 6px; padding: 5px 10px; margin-bottom: 8px; font-weight: 700; font-size: 15px; }
  .hint { border: 2px dashed var(--faint); border-radius: 10px; padding: 18px; color: var(--dim); font-size: 17px; text-align: center; margin: 10px 0; }

  /* clock */
  .clock { -webkit-flex-shrink: 0; flex-shrink: 0; padding: 0 2px; }
  .clock .t { font-size: 92px; font-weight: 800; line-height: .95; letter-spacing: -3px; font-variant-numeric: tabular-nums; }
  .clock .t small { font-size: 30px; letter-spacing: 0; margin-left: 6px; font-weight: 700; }
  .clock .d { font-size: 23px; font-weight: 600; margin-top: 6px; }
  .clock.sm .t { font-size: 56px; letter-spacing: -2px; } .clock.sm .t small { font-size: 22px; } .clock.sm .d { font-size: 19px; }

  /* agenda */
  .day { margin-bottom: 10px; }
  .day h3 { margin: 0 0 3px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--line); padding-bottom: 3px; }
  .day.today h3 { font-size: 17px; }
  .ev { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; padding: 6px 0; font-size: 19px; }
  .ev .t { width: 86px; -webkit-flex-shrink: 0; flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ev .t small { font-size: 13px; font-weight: 600; margin-left: 1px; }
  .ev .m { width: 20px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev .x { -webkit-flex: 1; flex: 1; min-width: 0; }
  .ev .loc { display: block; font-size: 14px; color: var(--dim); }
  .ev.past { opacity: .45; }
  .ev.now .x { font-weight: 800; }
  .ev .cdmark { font-size: 12px; font-weight: 800; border: 2px solid var(--fg); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
  .mk { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--fg); vertical-align: 0; }
  .mk0 { background: var(--fg); border-radius: 50%; } .mk1 { border-radius: 50%; } .mk2 { background: var(--fg); } .mk3 { }
  .mk4 { background: var(--fg); -webkit-transform: rotate(45deg) scale(.85); transform: rotate(45deg) scale(.85); }
  .mk5 { -webkit-transform: rotate(45deg) scale(.85); transform: rotate(45deg) scale(.85); }
  .key { font-size: 14px; color: var(--dim); padding: 6px 2px 0; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .key span { margin-right: 14px; white-space: nowrap; } .key .mk { margin-right: 5px; }

  /* tasks */
  .task { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 9px 0; font-size: 20px; border-bottom: 1px solid var(--faint); }
  .task:last-child { border-bottom: 0; }
  .task .bx { width: 30px; height: 30px; border: 3px solid var(--fg); border-radius: 6px; margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; position: relative; }
  .task.done .bx { background: var(--fg); }
  .task.done .bx:after { content: ""; position: absolute; left: 8px; top: 2px; width: 7px; height: 14px; border: solid var(--bg); border-width: 0 3px 3px 0;
                         -webkit-transform: rotate(45deg); transform: rotate(45deg); }
  .task .tt { -webkit-flex: 1; flex: 1; min-width: 0; word-wrap: break-word; }
  .task.done .tt { text-decoration: line-through; color: var(--dim); }
  .task .due { font-size: 13px; font-weight: 700; border: 2px solid var(--fg); border-radius: 4px; padding: 0 5px; margin-left: 8px; white-space: nowrap; }
  .task .due.late { background: var(--fg); color: var(--bg); }
  .task.busy { opacity: .5; }
  .task.held { background: var(--shade); }

  /* weather */
  .wx { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .wx .ic { width: 60px; height: 60px; margin-right: 10px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .wx .tmp { font-size: 54px; font-weight: 800; line-height: 1; }
  .wx .tx { font-size: 17px; font-weight: 600; margin-left: 12px; }
  .wxd { display: -webkit-flex; display: flex; margin-top: 8px; border-top: 2px solid var(--line); padding-top: 6px; }
  .wxd > div { -webkit-flex: 1; flex: 1; text-align: center; font-size: 15px; }
  .wxd b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .wxd svg { width: 28px; height: 28px; display: block; margin: 2px auto; }
  svg.i { fill: none; stroke: var(--fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* calendar columns, week, month */
  .cols { display: -webkit-flex; display: flex; height: 100%; }
  .dcol { -webkit-flex: 1; flex: 1; min-width: 0; border: 3px solid var(--line); border-radius: 10px; display: -webkit-flex; display: flex;
          -webkit-flex-direction: column; flex-direction: column; overflow: hidden; }
  .dcol + .dcol { margin-left: 10px; }
  .dcol .dh { background: var(--bg); border-bottom: 3px solid var(--line); padding: 6px 10px; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
  .dcol .dh span { display: block; font-size: 26px; letter-spacing: 0; }
  .dcol.today .dh { background: var(--fg); color: var(--bg); }
  .dcol .pbody { padding: 6px 8px; }
  .cev { border-left: 4px solid var(--fg); padding: 3px 0 3px 7px; margin-bottom: 8px; font-size: 16px; }
  .cev .ct { font-weight: 800; font-size: 14px; display: block; }
  .cev .loc { display: block; font-size: 13px; color: var(--dim); }
  .cev.allday { border: 2px solid var(--fg); border-radius: 6px; padding: 3px 7px; font-weight: 700; }
  .cev.past { opacity: .45; }
  .week .dcol .dh span { font-size: 22px; }
  .week .cev { font-size: 14px; } .week .dcol + .dcol { margin-left: 6px; } .week .dcol .pbody { padding: 5px 5px; }
  .month { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; height: 100%; }
  .month .mh { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .mgrid { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; border: 3px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mrow { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; min-height: 0; }
  .mrow.hd { -webkit-flex: none; flex: none; background: var(--fg); color: var(--bg); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .mrow.hd div { padding: 4px 6px; }
  .mcell { -webkit-flex: 1; flex: 1; min-width: 0; border-right: 1px solid var(--faint); border-bottom: 1px solid var(--faint); padding: 3px 5px; overflow: hidden; font-size: 12px; }
  .mcell .n { font-weight: 800; font-size: 15px; }
  .mcell.other { color: var(--dim); background: var(--shade); }
  .mcell.today .n { background: var(--fg); color: var(--bg); border-radius: 10px; padding: 0 6px; }
  .mcell .mi { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }

  /* countdown cards */
  .cards { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; height: 100%; -webkit-align-content: stretch; align-content: stretch; }
  .card { width: calc(50% - 6px); height: calc(50% - 6px); border: 3px solid var(--line); border-radius: 14px; padding: 16px 20px; display: -webkit-flex; display: flex;
          -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-between; justify-content: space-between; margin-bottom: 12px; overflow: hidden; }
  .card:nth-child(odd) { margin-right: 12px; }
  .card.one { width: 100%; height: 100%; margin-right: 0; }
  .card.tall { height: 100%; margin-bottom: 0; }
  .card .ttl { font-size: 26px; font-weight: 800; }
  .card .dt { font-size: 17px; color: var(--dim); margin-top: 4px; }
  .card .big { font-size: 84px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .card .big small { font-size: 26px; letter-spacing: 0; margin-left: 8px; }
  .card.today { background: var(--fg); color: var(--bg); } .card.today .dt { color: var(--bg); opacity: .8; }

  /* personal + family */
  .pf { display: -webkit-flex; display: flex; height: 100%; }
  .pf .side { -webkit-flex: 1; flex: 1; min-width: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .pf .side + .side { margin-left: 14px; padding-left: 14px; border-left: 3px solid var(--line); }
  .pf .who { font-size: 30px; font-weight: 800; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* night clock */
  .nclock { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
  .nclock .t { font-size: 200px; font-weight: 800; line-height: .9; letter-spacing: -8px; font-variant-numeric: tabular-nums; }
  .nclock .t small { font-size: 50px; letter-spacing: 0; margin-left: 10px; }
  .nclock .d { font-size: 38px; font-weight: 700; margin-top: 14px; }
  .nclock .nx { font-size: 26px; margin-top: 26px; color: var(--dim); }
  .nclock .nx b { color: var(--fg); }

  /* photos */
  .pframe { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; overflow: hidden; }
  .pframe canvas { position: absolute; left: 50%; top: 50%; image-rendering: -webkit-optimize-contrast; image-rendering: pixelated; image-rendering: crisp-edges; }
  .pframe .corner { position: absolute; right: 18px; bottom: 18px; background: #fff; color: #000; border: 3px solid #000; border-radius: 10px; padding: 8px 14px; font-size: 20px; font-weight: 700; max-width: 70%; }
  .pframe .corner b { font-size: 30px; display: block; }

  /* ---------- overlays ---------- */
  .scrim { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 20; }
  #sheet .card2 { position: absolute; left: 50%; top: 40px; width: 600px; max-width: 94%; max-height: calc(100% - 60px); -webkit-transform: translateX(-50%); transform: translateX(-50%);
                  background: var(--bg); color: var(--fg); border: 3px solid var(--line); border-radius: 14px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; overflow: hidden; }
  #sheet .sh { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 12px 16px; border-bottom: 3px solid var(--line); }
  #sheet .sh h2 { margin: 0; font-size: 22px; -webkit-flex: 1; flex: 1; min-width: 0; }
  #sheet .sb { padding: 14px 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #sheet .sf { padding: 12px 16px; border-top: 2px solid var(--faint); text-align: right; }
  #sheet .sf .btn { margin-left: 8px; }
  #sheet .sf .left { float: left; margin-left: 0; }
  .fld { margin-bottom: 14px; }
  .fld > label, .lbl { display: block; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .inp { width: 100%; font-size: 19px; padding: 9px 11px; border: 3px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); -webkit-appearance: none; border-radius: 8px; font-family: inherit; }
  select.inp { background-image: none; }
  .two { display: -webkit-flex; display: flex; } .two > * { -webkit-flex: 1; flex: 1; min-width: 0; } .two > * + * { margin-left: 10px; }
  .chk { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 19px; padding: 6px 0; }
  .chk .bx { width: 30px; height: 30px; border: 3px solid var(--fg); border-radius: 6px; margin-right: 12px; position: relative; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .chk.on .bx { background: var(--fg); }
  .chk.on .bx:after { content: ""; position: absolute; left: 8px; top: 2px; width: 7px; height: 14px; border: solid var(--bg); border-width: 0 3px 3px 0; -webkit-transform: rotate(45deg); transform: rotate(45deg); }
  .sw { display: inline-block; width: 58px; height: 32px; border: 3px solid var(--fg); border-radius: 16px; position: relative; -webkit-flex-shrink: 0; flex-shrink: 0; vertical-align: middle; }
  .sw:after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); -webkit-transition: left .15s; transition: left .15s; }
  .sw.on { background: var(--fg); } .sw.on:after { left: 29px; background: var(--bg); }
  .info { font-size: 18px; margin-bottom: 10px; } .info .k { color: var(--dim); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: block; }
  .note { font-size: 15px; color: var(--dim); border-left: 4px solid var(--faint); padding: 4px 10px; margin: 10px 0; }
  .confirm { border: 3px dashed var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; font-weight: 700; font-size: 18px; }
  .confirm .btn { margin: 8px 8px 0 0; }

  /* settings */
  #settings { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: var(--bg); color: var(--fg); z-index: 15; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  #settings .st { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 12px 16px; border-bottom: 3px solid var(--line); }
  #settings .st h1 { margin: 0; font-size: 24px; -webkit-flex: 1; flex: 1; }
  #settings .sbody { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; min-height: 0; }
  #settings .tabs { width: 220px; border-right: 3px solid var(--line); overflow-y: auto; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #settings .tab { display: block; width: 100%; text-align: left; padding: 15px 16px; font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--faint); }
  #settings .tab.on { background: var(--fg); color: var(--bg); }
  #settings .pane { -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 22px 40px; min-width: 0; }
  #settings h2 { font-size: 22px; margin: 0 0 6px; }
  #settings h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; margin: 22px 0 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
  #settings .lead { color: var(--dim); font-size: 16px; margin: 0 0 12px; }
  .srow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--faint); font-size: 18px; min-height: 56px; }
  .srow .grow { min-width: 0; }
  .srow .grow small { display: block; color: var(--dim); font-size: 14px; }
  .srow > * + * { margin-left: 10px; }
  .tag { font-size: 12px; font-weight: 800; border: 2px solid var(--fg); border-radius: 4px; padding: 0 5px; text-transform: uppercase; letter-spacing: 1px; margin-left: 6px; }
  .arrow { width: 40px; height: 40px; border: 2px solid var(--line); border-radius: 8px; font-size: 18px; font-weight: 800; }
  .arrow[disabled] { opacity: .25; }
  .seg { display: inline-block; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; white-space: nowrap; }
  .seg button { padding: 8px 14px; font-weight: 700; font-size: 16px; border-left: 2px solid var(--line); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--fg); color: var(--bg); }

<body>
<div id="app">
  <div id="hdr"><div class="nm" id="hName">InkBoard</div><div class="cds" id="hCds"></div><div class="tm" id="hTime"></div></div>
  <div id="pager"><div id="track"></div></div>
  <div id="bar">
    <div class="side"><button class="btn" data-act="addev">+ Event</button></div>
    <div id="dots" data-hold="settings" data-hold-ms="2000"></div>
    <div class="side r"><span class="upd" id="upd"></span><button class="btn" data-act="sleep">Sleep</button></div>
  </div>
</div>
<div id="sheet" class="scrim hide" data-act="scrim"><div class="card2" id="sheetCard" data-act="noop"></div></div>
<div id="settings" class="hide"></div>
<div id="sleep" class="hide" data-act="wake"></div>
<div id="toast" class="hide"></div>
<div id="setup" class="hide"></div>
<input type="file" id="filePick" accept="image/*" multiple class="hide">
<script>
(function () {
  // Written for old iPads: plain ES5 only (no arrow functions, let/const, template strings).

  // ================================================================
  //  SMALL HELPERS
  // ================================================================
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function attr(el, k) { return el.getAttribute('data-' + k); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  }
  function each(o, fn) { for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) fn(o[k], k); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // Dates are handled as 'YYYY-MM-DD' keys and day numbers, never parsed from text by the browser
  // (old Safari reads some date strings wrongly).
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dnOf(k) { var p = k.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function keyFromDn(n) { var d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }

  function todayKey() { return keyOf(new Date()); }
  function wdOf(k) { return new Date(dnOf(k) * 864e5).getUTCDay(); }
  function partsOf(k) { var p = k.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function localMs(k, hh, mm) { var p = partsOf(k); return new Date(p.y, p.m, p.d, hh || 0, mm || 0).getTime(); }

    return { t: (h % 12 || 12) + ':' + pad(m), a: h < 12 ? 'am' : 'pm', hh: pad(h) + ':' + pad(m) };
  }
  function hm(ms) { var t = timeParts(ms); return t.t + ' ' + t.a; }
  function shortDay(k) { var p = partsOf(k); return DAYS[wdOf(k)].substr(0, 3) + ', ' + MONTHS[p.m].substr(0, 3) + ' ' + p.d; }
  function longDay(k) { var p = partsOf(k); return DAYS[wdOf(k)] + ', ' + MONTHS[p.m] + ' ' + p.d; }
  function dayLabel(k) {
    var n = dnOf(k) - dnOf(todayKey());
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';
    var p = partsOf(k);
    return DAYS[wdOf(k)] + ', ' + MONTHS[p.m].substr(0, 3) + ' ' + p.d;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.className = '';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'hide'; }, 3500);
  }

  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('inkboard.' + k)); localStorage.setItem('inkboard.' + k, JSON.stringify(v)); } catch (e) { return null; } }

  // ================================================================
  //  CONNECTION (link to the Google backend + key)
  // ================================================================
  var IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  var CFG = store('cfg') || {};
  (function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    var out = {};
    h.split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) out[kv.substr(0, i)] = decodeURIComponent(kv.substr(i + 1)); });

    if (out.k) CFG.key = out.k;
    if (out.api || out.k) store('cfg', CFG);
  })();

  function api(action, args, ok, fail) {
    fail = fail || function (e) { toast(e); };
    var done = function (r) { if (r && r.ok) { if (ok) ok(r.data); } else fail(r ? r.error : 'No answer'); };
    if (window.__MOCK_API) { setTimeout(function () { done(window.__MOCK_API(CFG.key, action, args || [])); }, 80); return; }

    }

    var x = new XMLHttpRequest();
    x.open('POST', CFG.api, true);
    x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');

  }

  // ================================================================
  //  STATE + LOADING
  // ================================================================
  var B = null;            // everything from the backend
  var S = null;            // B.settings
  var view = 0;
  var online = true, loadedAt = 0, loading = false;
  var lastInteraction = Date.now();
  var sheetOpen = false, settingsOpen = false, sleeping = false;
  var reloadTimer = null, pollTimer = null;
  var POLL_MS = 3 * 60000;

  function load(cb) {
    if (loading) return;
    loading = true;
    api('board', [], function (d) {
      loading = false;
      B = d; S = d.settings; loadedAt = Date.now(); online = true;
      store('board', d);
      renderAll();
      if (settingsOpen) renderSettingsSoft();
      if (cb) cb();
      schedulePoll(POLL_MS);
    }, function (e) {
      loading = false;
      if (e === 'offline') { online = false; renderBar(); schedulePoll(60000); return; }
      if (/key|Set your own KEY|Not connected/i.test(e)) { showSetup(e); return; }
      online = false; renderBar(); toast(e); schedulePoll(60000);
    });
  }
  function schedulePoll(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(function () { load(); }, ms); }
  function reloadSoon(ms) { clearTimeout(reloadTimer); reloadTimer = setTimeout(function () { load(); }, ms || 1500); }

  // Change something now on screen, tell Google, then refresh from Google.
  function send(action, args, undo, failMsg) {
    renderAll();
    api(action, args, function () { reloadSoon(); }, function (e) {
      if (undo) undo();
      renderAll();
      toast(e === 'offline' ? (failMsg || 'Could not save. Check Wi-Fi and try again.') : e);
    });
  }

  function saveSettings(patch, cb) {
    each(patch, function (v, k) { S[k] = v; });
    renderAll();
    api('saveSettings', [patch], function (s) {
      B.settings = S = s;
      reloadSoon(600);
      if (cb) cb();
    }, function (e) { toast(e === 'offline' ? 'Could not save. Check Wi-Fi.' : e); });
  }

  // ================================================================
  //  CALENDAR + TASK HELPERS
  // ================================================================
  function calById(id) { for (var i = 0; i < B.calendars.length; i++) if (B.calendars[i].id === id) return B.calendars[i]; return null; }
  function shownCalIds() { var o = {}; B.calendars.forEach(function (c) { if (c.show) o[c.id] = true; }); return o; }
  function setOf(arr) { var o = {}; (arr || []).forEach(function (x) { o[x] = true; }); return o; }
  function markerHTML(calId) {
    var c = calById(calId);
    return c ? '<i class="mk mk' + (c.marker % 6) + '"></i>' : '';
  }
  function evDay(e) { return e.allDay ? e.startKey : keyOf(new Date(e.start)); }
  function eventsOn(k, cals) {
    var out = [];
    B.events.forEach(function (e) {
      if (!cals[e.calId]) return;
      if (e.allDay) { if (e.startKey <= k && k < e.endKey) out.push(e); }
      else if (keyOf(new Date(e.start)) === k) out.push(e);
    });
    out.sort(function (a, b) {
      if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
      return (a.start || 0) - (b.start || 0);
    });
    return out;
  }
  function findEvent(key) { for (var i = 0; i < B.events.length; i++) if (B.events[i].key === key) return B.events[i]; return null; }
  function nextEvent(cals) {
    var now = Date.now(), best = null;
    B.events.forEach(function (e) {
      if (!cals[e.calId] || e.allDay || e.end <= now) return;
      if (e.start - now > 2 * 864e5) return;
      if (!best || e.start < best.start) best = e;
    });
    return best;
  }
  function whenText(e) {
    if (e.allDay) {
      var last = addDays(e.endKey, -1);
      return last > e.startKey ? shortDay(e.startKey) + ' – ' + shortDay(last) + ' · All day' : longDay(e.startKey) + ' · All day';
    }
    return longDay(evDay(e)) + ' · ' + hm(e.start) + ' – ' + hm(e.end);
  }
  function countdownOn(key) {
    for (var i = 0; i < B.countdowns.length; i++) if (B.countdowns[i].key === key) return true;
    return false;
  }
  function cdLabel(c) {
    var n = dnOf(c.day) - dnOf(todayKey());
    if (n <= 0) return 'Today!';
    if (n === 1) return '1 day';
    if (n > 99) return Math.round(n / 7) + ' wks';
    return n + ' days';
  }
  function liveCountdowns() { var t = todayKey(); return (B.countdowns || []).filter(function (c) { return c.day >= t; }); }

  function shownLists() { return B.lists.filter(function (l) { return l.show && B.tasks[l.id]; }); }
  function listById(id) { for (var i = 0; i < B.lists.length; i++) if (B.lists[i].id === id) return B.lists[i]; return null; }
  function findTask(listId, id) { var a = B.tasks[listId] || []; for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

  //  SUNRISE / SUNSET (for night mode and waking from sleep)
  // ================================================================
  var sunCache = {};

    if (sunCache[ck]) return sunCache[ck];

    var jd = Date.UTC(p.y, p.m, p.d, 12) / 864e5 + 2440587.5;
    var n = Math.round(jd - 2451545 + 0.0008);
    var js = n - S.lon / 360;
    var M = (357.5291 + 0.98560028 * js) % 360;
    var C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);

    var jt = 2451545 + js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);

    else if (cw < -1) out = { rise: null, set: null, allDay: true };

      out = { rise: (jt - w / 360 - 2440587.5) * 864e5, set: (jt + w / 360 - 2440587.5) * 864e5 };

  }

    if (!S) { var h = new Date().getHours(); return h >= 20 || h < 7; }
    var st = sunTimes(todayKey()), now = Date.now();
    if (st.allNight) return true;
    if (st.allDay) return false;
    return now < st.rise || now >= st.set;
  }

  // ================================================================
  //  TOUCH: taps, press-and-hold, swiping between views
  //  Every tappable thing has data-act="...". Taps are handled on touchend, so they

  var ACT = {}, HOLD = {};

  }

  function holdBegin(el) {

    if (kind === 'taskd') el.className += ' held';

      holdFired = true;
      holdEnd(el);
      lastInteraction = Date.now();

  }
  function holdEnd(el) {

  document.addEventListener('touchmove', function (e) {

  document.addEventListener('touchend', function (e) {
    var now = Date.now();

  });

  document.addEventListener('click', function (e) {
    if (Date.now() - lastTouchEnd < 800) return;
    if (holdFired) { holdFired = false; return; }

    if (el) { e.preventDefault(); runAct(el); }
  });
  document.addEventListener('keydown', function (e) {
    lastInteraction = Date.now();

    if (e.keyCode === 37) goView(view - 1);
    if (e.keyCode === 39) goView(view + 1);
  });

  function showHoldBar(ms) {
    var d = $('dots');
    var bar = document.createElement('div'); bar.className = 'holdbar'; bar.id = 'holdbar';
    d.appendChild(bar);
    bar.style.webkitTransition = bar.style.transition = 'width ' + ms + 'ms linear';
    setTimeout(function () { bar.style.width = '90%'; }, 20);
    var tip = document.createElement('div'); tip.className = 'holdtip'; tip.id = 'holdtip'; tip.textContent = 'Keep holding for Settings';
    setTimeout(function () { if ($('holdbar')) d.appendChild(tip); }, 300);
  }
  function hideHoldBar() {
    var a = $('holdbar'), b = $('holdtip');
    if (a) a.parentNode.removeChild(a);
    if (b) b.parentNode.removeChild(b);
  }

  // Swiping
  var sw = null;
  function pagerW() { return $('pager').clientWidth; }
  function nViews() { return (S && S.views.length) || 1; }
  function setTrack(dx) {

  }

    var p = $('pager');

        sw.dx = dx;

    photoTimer = setInterval(function () {
      photoIdx++;
      if (sleeping && sleepMode === 'photos') showPhotoIn($('sleep').firstChild, true);
      fillPhotoViews();
    }, Math.max(1, S ? S.photoMinutes : 2) * 60000);
  }
  ACT.sleep = function () {
    if (!B) return;
    sleeping = true; sleepSince = Date.now();
    if (sheetOpen) closeSheet();
    $('sleep').className = '';
    drawSleep();
    startPhotoTimer();
  };
  function wake() {
    sleeping = false;
    $('sleep').className = 'hide'; $('sleep').innerHTML = '';
    lastInteraction = Date.now();
    goView(0);
    renderAll();
  }
  ACT.wake = wake;

  function fillPhotoViews() {
    var fs = document.querySelectorAll('.js-photoview');
    for (var i = 0; i < fs.length; i++) showPhotoIn(fs[i], true);
  }
  afterRenderHooks.push(fillPhotoViews);

  // ================================================================
  //  FIRST-TIME CONNECT SCREEN
  // ================================================================
  function showSetup(msg) {
    var el = $('setup');
    el.className = '';
    el.innerHTML = '<div class="box"><h1>Connect InkBoard</h1>' +
      '<p>Paste the two things from the setup guide. You only do this once on this iPad.</p>' +
      (msg && msg !== 'Not connected' ? '<div class="warn">' + esc(msg === 'Wrong key' ? 'That key doesn’t match. Check it and try again.' : msg) + '</div>' : '') +
      (IN_GAS ? '' : '<div class="fld"><label>Backend link (ends in /exec)</label><input class="inp" id="suApi" value="' + esc(CFG.api || '') + '" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/…/exec"></div>') +
      '<div class="fld"><label>Key</label><input class="inp" id="suKey" value="' + esc(CFG.key || '') + '" autocomplete="off" autocapitalize="off" autocorrect="off"></div>' +
      '<button class="btn pri" data-act="setupgo">Connect</button></div>';
  }
  ACT.setupgo = function () {
    if (!IN_GAS) CFG.api = val('suApi');
    CFG.key = val('suKey');
    if (!IN_GAS && !/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.api)) { toast('The backend link should start with https://script.google.com/'); return; }
    $('setup').innerHTML = '<div class="box"><h1>Connecting…</h1></div>';
    api('board', [], function (d) {
      store('cfg', CFG);
      $('setup').className = 'hide'; $('setup').innerHTML = '';
      B = d; S = d.settings; loadedAt = Date.now(); online = true; store('board', d);
      renderAll(); schedulePoll(POLL_MS);
    }, function (e) { showSetup(e === 'offline' ? 'Could not reach Google. Check the link and the Wi-Fi.' : e); });
  };

  // ================================================================
  //  CLOCK: time, night mode, back to home, waking at sunrise, self-repair
  // ================================================================
  var lastMinute = -1, lastDay = todayKey();
  function tick() {
    var now = Date.now(), d = new Date(now);
    if (!B) return;
    renderTime();
    var cs = document.querySelectorAll('.js-clock'), i;
    for (i = 0; i < cs.length; i++) cs[i].innerHTML = clockInner();
    var ns = document.querySelectorAll('.js-nclock');
    for (i = 0; i < ns.length; i++) ns[i].innerHTML = nightClockInner();
    var cn = document.querySelectorAll('.js-corner');
    for (i = 0; i < cn.length; i++) cn[i].innerHTML = photoCorner();
    applyBodyClass();

    if (todayKey() !== lastDay) { lastDay = todayKey(); renderAll(); load(); }
    else if (d.getMinutes() !== lastMinute) {
      lastMinute = d.getMinutes();
      if (lastMinute % 5 === 0 && !sheetOpen && !(sw && sw.on)) renderPages();   // fade past events
    }
    var idle = now - lastInteraction;
    if (!sleeping && !sheetOpen && !settingsOpen && view !== 0 && idle > S.homeMinutes * 60000) goView(0);
    if (sheetOpen && idle > 10 * 60000) closeSheet();
    if (settingsOpen && idle > 15 * 60000) hideSettings();

    if (sleeping) {
      var st = sunTimes(todayKey());
      if (st.rise && sleepSince < st.rise && now >= st.rise) wake();        // wakes at sunrise
      else {
        var want = (isNight() && S.sleepNight === 'dark') ? 'dark' : (PHOTOS.length ? 'photos' : 'clock');
        if (want !== sleepMode) drawSleep();
      }
    }

    // Self-repair: if Safari froze the page or data is very old, reload it.
    var lastReload = +(store('reloadAt') || 0);
    if (now - loadedAt > 30 * 60000 && now - lastReload > 30 * 60000 && navigator.onLine !== false) { store('reloadAt', now); location.reload(); }
    if (d.getHours() === 3 && store('nightly') !== todayKey()) { store('nightly', todayKey()); store('reloadAt', now); location.reload(); }
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && B) load(); });

  // ================================================================
  //  START
  // ================================================================
  function start() {
    var cached = store('board');
    if (cached && cached.settings) { B = cached; S = cached.settings; loadedAt = cached.updated || 0; renderAll(); }
    else renderBar();
    load();
    loadPhotos(function () { if (B) startPhotoTimer(); fillPhotoViews(); });
    setInterval(tick, 10000);
  }
  fitHeight();
  if (window.__MOCK_API) { CFG.key = CFG.key || 'test'; start(); }
  else if (IN_GAS && !CFG.key) {
    google.script.url.getLocation(function (loc) {
      if (loc && loc.parameter && loc.parameter.k) { CFG.key = loc.parameter.k; store('cfg', CFG); start(); }
      else showSetup();
    });
  } else if (!IN_GAS && !CFG.api) showSetup();
  else start();

  window.InkBoard = { load: load, state: function () { return { B: B, view: view, sleeping: sleeping, sheetOpen: sheetOpen, settingsOpen: settingsOpen }; } };
})();
</script>
</body>
