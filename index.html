<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="InkBoard">
<meta name="format-detection" content="telephone=no">
<title>InkBoard</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --past: #9a9a9a; --bg: #fff; --fg: #000; --dim: #5a5a5a; --faint: #d6d6d6; --line: #000; --shade: #f1f1f1; }
  body.night { --past: #6a6a6a; --bg: #000; --fg: #fff; --dim: #a8a8a8; --faint: #333; --line: #fff; --shade: #161616; }
  body.night.quiet { --fg: #cfcfcf; --dim: #7a7a7a; --faint: #2a2a2a; --line: #2a2a2a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  input, select, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-appearance: none; }
  [data-act], [data-hold] { cursor: pointer; }
  .hide { display: none !important; }
  svg.i { fill: none; stroke: var(--fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- frame: header, pages, bottom bar ---------- */
  #app { position: absolute; left: 0; top: 0; right: 0; height: 100%; display: -webkit-flex; display: flex;
         -webkit-flex-direction: column; flex-direction: column; padding: 12px 16px 8px; }
  #hdr { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-bottom: 2px solid var(--line);
         padding: 0 0 8px; margin-bottom: 16px; min-height: 40px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #hdr .nm { font-weight: 800; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hdr .hc { margin-left: auto; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; white-space: nowrap; padding-left: 14px; }
  .hcd { position: relative; border: 2px solid var(--fg); border-radius: 8px; padding: 4px 10px; font-size: 15px; font-weight: 800; white-space: nowrap; }
  .hcd.today { background: var(--fg); color: var(--bg); }
  .htime { font-size: 24px; font-weight: 800; margin-left: 16px; font-variant-numeric: tabular-nums; }
  .htime small { font-size: 15px; margin-left: 2px; }
  .hwx { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 18px; }
  .hwx svg { width: 28px; height: 28px; margin: 0 8px; }
  .hwx b { font-size: 24px; margin-right: 6px; }
  .hwx .lab { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: var(--dim); }
  .hwx .dim { color: var(--dim); margin-right: 6px; }

  #pager { -webkit-flex: 1; flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #track { position: absolute; left: 0; top: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-transition: -webkit-transform .3s ease; transition: transform .3s ease; }
  #track.drag { -webkit-transition: none; transition: none; }
  .page { height: 100%; overflow: hidden; position: relative; }
  .page > .inner { height: 100%; }

  #bar { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-top: 2px solid var(--line);
         padding-top: 8px; margin-top: 8px; min-height: 52px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  #bar .side { -webkit-flex: 1; flex: 1; width: 0; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #bar .side.r { -webkit-justify-content: flex-end; justify-content: flex-end; }
  #bar .upd { color: var(--dim); font-size: 15px; margin-right: 12px; white-space: nowrap; }
  #bar .upd.off { color: var(--fg); font-weight: 700; }
  #dots { -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center;
          -webkit-align-items: center; align-items: center; height: 44px; position: relative; padding: 0 6px; }
  #dots .dot { width: 36px; height: 44px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #dots .dot i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); }
  #dots .dot.on i { background: var(--fg); }
  #dots .holdbar { position: absolute; left: 50%; bottom: -2px; height: 4px; width: 0; background: var(--fg); -webkit-transform: translateX(-50%); transform: translateX(-50%); }
  #dots .holdtip { position: absolute; bottom: 46px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); background: var(--fg); color: var(--bg);
                   padding: 6px 12px; border-radius: 8px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .btn { display: inline-block; border: 2px solid var(--line); border-radius: 8px; padding: 10px 16px; min-height: 44px; font-weight: 700; font-size: 18px; line-height: 1.2; white-space: nowrap; }
  .btn.sm { padding: 9px 12px; font-size: 15px; min-height: 40px; }
  .btn.pri { background: var(--fg); color: var(--bg); }
  .btn.warn { border-style: dashed; }
  .btn.warn:not(:active) { color: var(--fg); }
  .btn:active, .btn.pressed { background: var(--fg); color: var(--bg); }
  .btn.pri:active { background: var(--bg); color: var(--fg); }
  .pinb { display: -webkit-inline-flex; display: inline-flex; -webkit-align-items: center; align-items: center; border: 2px solid var(--line); border-radius: 8px;
          padding: 0 12px; height: 44px; font-weight: 700; font-size: 18px; margin-right: 8px; white-space: nowrap; }
  .pinb svg { margin-right: 6px; }
  .pinb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .pinb.on { background: var(--fg); color: var(--bg); }
  .pinb.on svg { margin-right: 6px; }
  /* quiet frame on the night clock */
  body.quiet #bar .btn, body.quiet .pinb { border-color: var(--faint); color: var(--dim); }
  body.quiet #bar .upd { visibility: hidden; }

  /* ---------- shared pieces ---------- */
  .vflex { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; height: 100%; }
  .grow { -webkit-flex: 1; flex: 1; min-height: 0; }
  .muted { color: var(--dim); }
  .none { color: var(--dim); font-size: 15px; padding: 6px 0; }
  .warn { border: 2px dashed var(--line); border-radius: 8px; padding: 5px 10px; margin-bottom: 8px; font-weight: 700; font-size: 15px; }
  .hint { border: 2px dashed var(--faint); border-radius: 10px; padding: 18px; color: var(--dim); font-size: 18px; text-align: center; margin: 10px 0; }
  .panel { border: 2px solid var(--line); border-radius: 10px; overflow: hidden; display: -webkit-flex; display: flex;
           -webkit-flex-direction: column; flex-direction: column; min-height: 0; }
  .panel.grow { -webkit-flex: 1; flex: 1; }
  .tbar { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: var(--fg); color: var(--bg);
          padding: 6px 8px 6px 12px; font-size: 15px; min-height: 44px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  body.night .tbar { background: none; color: var(--fg); border-bottom: 2px solid var(--line); }
  .tbar b { text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbar .cnt { border: 1px solid var(--bg); border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 800; margin-left: 8px; }
  body.night .tbar .cnt, body.night .tbar .add { border-color: var(--fg); }
  .tbar .sp { -webkit-flex: 1; flex: 1; }
  .tbar .add { border: 2px solid var(--bg); border-radius: 8px; padding: 0 12px; height: 32px; line-height: 28px; font-weight: 700; margin-left: 8px; white-space: nowrap; font-size: 15px; position: relative; }
  .tbar .add:after, .hcd:after, .nxl > span[data-act]:after { content: ""; position: absolute; left: -4px; right: -4px; top: -6px; bottom: -6px; }
  .nxl > span[data-act] { position: relative; }
  .tbar .add:active { background: var(--bg); color: var(--fg); }
  .pbody { padding: 6px 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; -webkit-flex: 1; flex: 1; }
  .fit { overflow: hidden !important; position: relative; }
  .fmore { font-size: 15px; color: var(--dim); font-weight: 700; padding: 6px 0 2px; }

  /* top strip (Home, To-do, Personal + Family) */
  .strip { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border: 2px solid var(--line); border-radius: 10px;
           padding: 8px 16px; margin-bottom: 16px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .strip .st-t { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .strip .st-t small { font-size: 24px; letter-spacing: 0; margin-left: 4px; }
  .strip .st-mid { margin-left: 22px; padding-left: 22px; border-left: 1px solid var(--faint); min-width: 0; -webkit-flex: 1; flex: 1; }
  .strip .st-d { font-size: 24px; font-weight: 700; white-space: nowrap; }
  .nxl { font-size: 18px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nxl b { font-size: 12px; letter-spacing: 1px; margin-right: 8px; text-transform: uppercase; }
  .nxl strong { font-weight: 700; margin-right: 10px; }
  .nxl i { font-style: normal; font-size: 15px; font-weight: 700; border: 1px solid var(--fg); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
  .strip .st-w { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-left: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .strip .st-w svg { width: 40px; height: 40px; }
  .strip .st-w .tmp { font-size: 34px; font-weight: 800; margin-left: 8px; line-height: 1; }
  .strip .st-w .tx { font-size: 15px; margin-left: 10px; line-height: 1.3; white-space: nowrap; }

  /* agenda rows */
  .dh3 { margin: 4px 0 3px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .dh3.today { font-size: 15px; }
  .ev { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; padding: 5px 0; font-size: 18px; }
  .ev .t { width: 76px; -webkit-flex-shrink: 0; flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  
  .ev .x { -webkit-flex: 1; flex: 1; min-width: 0; }
  .ev .loc { display: block; font-size: 12px; color: var(--dim); }
  .ev.past { opacity: .45; }
  .ev.now .x { font-weight: 800; }
  .ev.earlier { color: var(--dim); font-size: 15px; font-weight: 700; }
  .cdmark { font-size: 12px; font-weight: 800; border: 1px solid var(--fg); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }

  /* tasks */
  .task { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; min-height: 44px; padding: 6px 0; font-size: 18px; border-bottom: 1px solid var(--faint); }
  .task:last-child { border-bottom: 0; }
  .task .bx { width: 28px; height: 28px; border: 2px solid var(--fg); border-radius: 4px; margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; position: relative; }
  .task.done .bx { background: var(--fg); }
  .task.done .bx:after { content: ""; position: absolute; left: 8px; top: 2px; width: 7px; height: 14px; border: solid var(--bg); border-width: 0 3px 3px 0;
                         -webkit-transform: rotate(45deg); transform: rotate(45deg); }
  .task .tt { -webkit-flex: 1; flex: 1; min-width: 0; word-wrap: break-word; }
  .task .tl { display: block; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .task.done .tt { text-decoration: line-through; color: var(--dim); }
  .task .due { font-size: 12px; font-weight: 700; border: 1px solid var(--fg); border-radius: 4px; padding: 0 5px; margin-left: 8px; white-space: nowrap; }
  .task .due.late { background: var(--fg); color: var(--bg); }
  .task.busy { opacity: .5; }
  .task.held { background: var(--shade); }
  .small .task { font-size: 15px; padding: 4px 0; }
  .small .task .bx { width: 22px; height: 22px; border-radius: 4px; margin-right: 10px; }
  .small .task.done .bx:after { left: 6px; top: 1px; width: 5px; height: 11px; border-width: 0 2px 2px 0; }
  .small .task .due { font-size: 12px; }

  /* Home */
  .hrow { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1; min-height: 0; }
  .hrow > * { -webkit-flex: 1; flex: 1; min-width: 0; }
  .hrow > * + * { margin-left: 16px; }
  .fc { display: -webkit-flex; display: flex; border: 2px solid var(--line); border-radius: 10px; margin-top: 16px; padding: 8px 4px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .fc > div { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; font-size: 15px; white-space: nowrap; }
  .fc b { font-size: 12px; letter-spacing: 1px; }
  .fc svg { width: 22px; height: 22px; margin: 0 5px; }
  .fc .lo { color: var(--dim); margin-left: 3px; }

  /* Personal + Family */
  .pf { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1; min-height: 0; }
  .pf .side { -webkit-flex: 1; flex: 1; min-width: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .pf .side + .side { margin-left: 16px; }
  .pfbody { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; overflow: hidden; }
  .pfpart { -webkit-flex: 1; flex: 1; min-height: 0; }
  .pfpart + .pfpart { margin-top: 6px; }
  .pf .who-unused { font-size: 24px; font-weight: 800; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Calendar (time grid) */
  .tg { -webkit-flex: 1; flex: 1; min-height: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .tg-row { display: -webkit-flex; display: flex; }
  .tg-row > .gut { width: 40px; -webkit-flex-shrink: 0; flex-shrink: 0; position: relative; }
  .tg-row > .cc { -webkit-flex: 1; flex: 1; min-width: 0; border-left: 1px solid var(--faint); position: relative; }
  .tg-row > .cc.last { border-right: 1px solid var(--faint); }
  .tg-hd .cc { padding: 4px 8px 0; border-bottom: 2px solid var(--line); height: 52px; }
  .tg-hd .cc .w { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .tg-hd .cc .n { font-size: 24px; font-weight: 800; line-height: 1.05; }
  .tg-hd .cc.today { background: var(--fg); color: var(--bg); border-radius: 8px 8px 0 0; }
  body.night .tg-hd .cc.today { background: none; color: var(--fg); border: 2px solid var(--line); border-bottom-width: 2px; }
  .tg-ad .cc { border-bottom: 1px solid var(--faint); padding: 3px 4px; min-height: 26px; }
  .tg-ad .gut { font-size: 12px; padding-right: 6px !important; color: var(--dim); text-align: right; padding: 8px 8px 0 0; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  .tg-ad .chip { font-size: 12px; font-weight: 800; border: 2px solid var(--fg); border-radius: 4px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 16px; margin-bottom: 2px; }
  .tg-body { -webkit-flex: 1; flex: 1; min-height: 0; }
  .tg-body .cc { border-bottom: 1px solid var(--faint); }
  .tg-body .cc.today { background-color: var(--shade); }
  .tg-body .hl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--faint); }
  .tg-body .gut div { position: absolute; right: 8px; font-size: 12px; color: var(--dim); -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  .blk { position: absolute; z-index: 1; border: 2px solid var(--fg); border-radius: 4px; padding: 2px 6px; line-height: 1.2; overflow: hidden; background: var(--bg); min-height: 24px; }
  .blk.tiny { padding: 0 6px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .blk.tiny b { font-size: 12px; line-height: 1; }
  .blk.narrow b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .blk b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk span { font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk.past { color: var(--past); border-color: var(--past); }
  .tg-body .cc.today .blk { background: var(--bg); }
  .nowl { position: absolute; left: -1px; right: 0; height: 0; border-top: 3px solid var(--fg); z-index: 0; }
  .nowl:before { content: ""; position: absolute; left: -5px; top: -7px; width: 11px; height: 11px; border-radius: 50%; background: var(--fg); }
  .navrow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; height: 56px; margin-top: 6px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .navrow > .s { -webkit-flex: 1; flex: 1; width: 0; display: -webkit-flex; display: flex; -webkit-justify-content: flex-end; justify-content: flex-end; }
  .navrow .ab { width: 52px; height: 46px; border: 2px solid var(--line); border-radius: 8px; font-size: 32px; font-weight: 700; line-height: 38px; text-align: center; }
  .navrow .ab:active { background: var(--fg); color: var(--bg); }
  .navrow .rg { font-size: 18px; font-weight: 800; margin: 0 18px; min-width: 200px; text-align: center; white-space: nowrap; }

  /* Countdowns */
  .cdw { height: 100%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .cdg { position: relative; }
  .cdt { position: absolute; border: 2px solid var(--line); border-radius: 10px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
         -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; text-align: center; overflow: hidden; padding: 6px; }
  .cdt.hero { background: var(--fg); color: var(--bg); }
  body.night .cdt.hero { background: none; color: var(--fg); border-width: 4px; }
  .cdt.add { border: 2px dashed var(--faint); color: var(--dim); font-weight: 700; -webkit-justify-content: center; justify-content: center; }
  .cdt.empty { border: 2px dashed var(--faint); }
  .cdmini { position: relative; width: 132px; height: 82px; margin: 0 auto 6px; }
  .cdmini i { position: absolute; border: 1.5px solid var(--fg); border-radius: 3px; display: block; }
  .cdl-row { display: -webkit-flex; display: flex; margin: 6px -6px 4px; }
  .cdl { position: relative; -webkit-flex: 1; flex: 1; margin: 0 6px; border: 2px solid var(--faint); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .cdl.on { border-color: var(--line); border-width: 3px; padding: 9px 7px; }
  .cdl b { display: block; font-size: 15px; } .cdl span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .cdt .n { font-weight: 800; line-height: .85; font-variant-numeric: tabular-nums; }
  .cdt .u { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .cdt .wd { font-weight: 700; opacity: .75; }
  .cdt .ctop { -webkit-flex: 1; flex: 1; min-height: 0; width: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; }
  .cdt .cbot { -webkit-flex: none; flex: none; width: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: flex-end; justify-content: flex-end; -webkit-align-items: center; align-items: center; }
  .cdt .tt { font-weight: 800; line-height: 1.2; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; padding-bottom: 1px; }
  .cdt .dt { opacity: .6; }

  /* Month */
  .mg { -webkit-flex: 1; flex: 1; min-height: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; border-top: 2px solid var(--line); }
  .mwh { display: -webkit-flex; display: flex; height: 26px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .mwh div { -webkit-flex: 1; flex: 1; font-size: 12px; font-weight: 800; letter-spacing: 1px; padding: 5px 8px; border-bottom: 1px solid var(--faint); }
  .mwk { -webkit-flex: 1; flex: 1; min-height: 0; position: relative; display: -webkit-flex; display: flex; }
  .mc { -webkit-flex: 1; flex: 1; min-width: 0; border-right: 1px solid var(--faint); border-bottom: 1px solid var(--faint); padding: 4px 6px; overflow: hidden; }
  .mc:nth-child(7) { border-right: 0; }
  .mc .n { font-size: 15px; font-weight: 800; height: 22px; display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; }
  .mc .n small { font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .5px; margin-left: 6px; }
  .mc.today { background: var(--shade); }
  .mc.today .n span { background: var(--fg); color: var(--bg); border-radius: 4px; padding: 0 6px; }

    if (!AUTO_ORIENT) {
      if (orient === 3) { g.translate(cw, ch); g.rotate(Math.PI); }
      else if (orient === 6) { g.translate(ch, 0); g.rotate(Math.PI / 2); }
      else if (orient === 8) { g.translate(0, cw); g.rotate(-Math.PI / 2); }
    }
    g.drawImage(img, 0, 0, cw, ch);
    return c.toDataURL('image/jpeg', quality);
  }
  function photoAddFiles(files) {
    var list = [];
    for (var i = 0; i < files.length; i++) list.push(files[i]);
    list = list.slice(0, MAX_PHOTOS);
    if (!list.length) return;
    toast('Adding ' + list.length + ' photo' + (list.length > 1 ? 's' : '') + '…');
    var added = 0;
    (function next() {
      if (!list.length) {
        var extra = PHOTOS.length - MAX_PHOTOS;
        var finish = function () { toast(added + ' photo' + (added === 1 ? '' : 's') + ' added.'); if (settingsOpen) renderSettings(); };
        if (extra > 0) {
          var old = PHOTOS.slice(0, extra), left = old.length;
          old.forEach(function (p) { photoRemove(p.id, function () { if (--left === 0) finish(); }); });
        } else finish();
        return;
      }
      var f = list.shift(), rd = new FileReader();
      rd.onload = function () {
        var orient = exifOrientation(rd.result);
        var url = URL.createObjectURL(f), img = new Image();
        img.onload = function () {
          var p = { id: Date.now() + added, data: scaled(img, 1400, orient, 0.82), thumb: scaled(img, 280, orient, 0.7) };
          URL.revokeObjectURL(url);
          PHOTOS.push(p); added++;
          photoPut(p, next);
        };
        img.onerror = function () { URL.revokeObjectURL(url); toast('One photo could not be read.'); next(); };
        img.src = url;
      };
      rd.onerror = next;
      rd.readAsArrayBuffer(f);
    })();
  }
  $('filePick').addEventListener('change', function () { photoAddFiles(this.files); this.value = ''; });

  // 1-bit "dithered" drawing: Atkinson dithering, scaled up with hard pixels.
  var DOT = { fine: 1, medium: 2, bold: 3 };
  function drawDithered(canvas, src, W, H, dotName, cb) {
    var img = new Image();
    img.onload = function () {
      var dot = DOT[dotName] || 2, w = Math.max(1, Math.floor(W / dot)), h = Math.max(1, Math.floor(H / dot));
      canvas.width = w; canvas.height = h;
      var g = canvas.getContext('2d');
      var k = Math.max(w / img.width, h / img.height), dw = img.width * k, dh = img.height * k;
      g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      var id = g.getImageData(0, 0, w, h), d = id.data, n = w * h, lum = new Float32Array(n), i;
      for (i = 0; i < n; i++) lum[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          i = y * w + x;
          var o = lum[i], nv = o < 128 ? 0 : 255, err = (o - nv) / 8;
          lum[i] = nv;
          if (x + 1 < w) lum[i + 1] += err;
          if (x + 2 < w) lum[i + 2] += err;
          if (y + 1 < h) { if (x > 0) lum[i + w - 1] += err; lum[i + w] += err; if (x + 1 < w) lum[i + w + 1] += err; }
          if (y + 2 < h) lum[i + 2 * w] += err;
        }
      }
      for (i = 0; i < n; i++) { var c = lum[i] < 128 ? 0 : 255; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = c; d[i * 4 + 3] = 255; }
      g.putImageData(id, 0, 0);
      canvas.style.width = (w * dot) + 'px'; canvas.style.height = (h * dot) + 'px';
      canvas.style.marginLeft = (-w * dot / 2) + 'px'; canvas.style.marginTop = (-h * dot / 2) + 'px';
      if (cb) cb();
    };
    img.src = src;
  }
  var SAMPLE = null;
  function sampleImage() {
    if (SAMPLE) return SAMPLE;
    var c = document.createElement('canvas'); c.width = 320; c.height = 200;
    var g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 320, 200);
    gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000');
    g.fillStyle = gr; g.fillRect(0, 0, 320, 200);
    g.fillStyle = '#222'; g.beginPath(); g.arc(110, 100, 60, 0, 7); g.fill();
    g.fillStyle = '#ddd'; g.beginPath(); g.arc(230, 90, 40, 0, 7); g.fill();
    SAMPLE = c.toDataURL();
    return SAMPLE;
  }
  function drawDotPreview() {
    var c = $('dotPrev'); if (!c) return;
    drawDithered(c, PHOTOS.length ? PHOTOS[PHOTOS.length - 1].data : sampleImage(), 260, 160, S.dotSize);
  }

  // ================================================================
  //  SLEEP (tap Sleep in the bottom bar; wakes at sunrise or on touch)
  //  Night: nearly dark (dim clock + tomorrow's weather), or your photos dimmed.
  //  Day: your photos in a frame, or a quiet clock when there are none.
  // ================================================================
  var photoIdx = 0, photoTimer = null, sleepSince = 0, sleepMode = '';
  function sleepWant() { return (isNight() && S.sleepNight === 'dark') ? 'dark' : (PHOTOS.length ? 'photos' : 'clock'); }
  function sleepHead() { return '<div class="sl-h"><span class="nm">' + esc(S.name || 'InkBoard') + '</span>' + wxCompact(isNight() || isEvening()) + '</div>'; }
  var SLP = '<div class="slp">SLEEPING<span> · touch to wake</span></div>';
  function drawSleep() {
    var el = $('sleep'), mode = sleepWant(), night = isNight();
    sleepMode = mode;
    if (mode === 'photos') {
      el.className = night ? 'nightsoft' : '';
      el.innerHTML = sleepHead() + '<div class="sl-ph"><canvas></canvas></div><div class="sl-cap"><div class="t js-slt">' + timeBig() + '</div><div class="m">' + SLP + '</div><div class="d">' + longDay(todayKey()) + '</div></div>';
      showPhoto();
      return;
    }
    el.className = mode === 'dark' ? 'dim' : (night ? 'nightsoft' : '');
    el.innerHTML = sleepHead() + '<div class="sl-c"><div class="t js-slt">' + timeBig() + '</div>' + (mode === 'dark' ? '' : '<div class="d">' + longDay(todayKey()) + '</div>') + '</div><div class="sl-f">' + SLP + '</div>';
  }
  function showPhoto() {
    var fr = document.querySelector('#sleep .sl-ph');
    if (!fr || !PHOTOS.length) return;
    var p = PHOTOS[photoIdx % PHOTOS.length];
    drawDithered(fr.firstChild, p.data, fr.clientWidth, fr.clientHeight, S.dotSize);
  }
  function startPhotoTimer() {
    clearInterval(photoTimer);
    photoTimer = setInterval(function () {
      photoIdx++;
      if (sleeping && sleepMode === 'photos') showPhoto();
    }, Math.max(1, S ? S.photoMinutes : 2) * 60000);
  }
  ACT.sleep = function () {
    if (!B) return;
    sleeping = true; sleepSince = Date.now();
    if (sheetOpen) closeSheet();
    closePinMenu();
    drawSleep();
    startPhotoTimer();
  };
  function wake() {
    sleeping = false;
    $('sleep').className = 'hide'; $('sleep').innerHTML = '';
    lastInteraction = Date.now();
    calOff = 0; monthOff = 0;
    goView(0);
    renderAll();
  }
  ACT.wake = wake;
  function fillPhotoViews() {}

  // ================================================================
  //  FIRST-TIME CONNECT SCREEN
  // ================================================================
  function showSetup(msg) {
    var el = $('setup');
    el.className = '';
    el.innerHTML = '<div class="box"><h1>Connect InkBoard</h1>' +
      '<p>Paste the two things from the setup guide. You only do this once on this iPad.</p>' +
      (msg && msg !== 'Not connected' ? '<div class="warn">' + esc(msg === 'Wrong key' ? 'That key doesn’t match. Check it and try again.' : msg) + '</div>' : '') +
      (IN_GAS ? '' : '<div class="fld"><label>Backend link (ends in /exec)</label><input class="inp" id="suApi" value="' + esc(CFG.api || '') + '" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/…/exec"></div>') +
      '<div class="fld"><label>Key</label><input class="inp" id="suKey" value="' + esc(CFG.key || '') + '" autocomplete="off" autocapitalize="off" autocorrect="off"></div>' +
      '<button class="btn pri" data-act="setupgo">Connect</button></div>';
  }
  ACT.setupgo = function () {
    if (!IN_GAS) CFG.api = val('suApi');
    CFG.key = val('suKey');
    if (!IN_GAS && !/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.api)) { toast('The backend link should start with https://script.google.com/'); return; }
    $('setup').innerHTML = '<div class="box"><h1>Connecting…</h1></div>';
    api('board', [], function (d) {
      store('cfg', CFG);
      $('setup').className = 'hide'; $('setup').innerHTML = '';
      B = d; S = d.settings; loadedAt = Date.now(); online = true; store('board', d);
      renderAll(); schedulePoll(POLL_MS);
    }, function (e) { showSetup(e === 'offline' ? 'Could not reach Google. Check the link and the Wi-Fi.' : e); });
  };

  // ================================================================
  //  CLOCK: time, night mode, going home / rotating, pin, waking at sunrise, self-repair
  // ================================================================
  var lastMinute = -1, lastDay = todayKey(), idleStart = 0, lastRotate = 0;
  function autoView(i) { calOff = 0; monthOff = 0; goView(i); renderPages(); }
  function tick() {
    var now = Date.now(), d = new Date(now), i;
    if (!B) return;
    renderTime();
    var q = function (sel, fn) { var els = document.querySelectorAll(sel); for (i = 0; i < els.length; i++) els[i].innerHTML = fn(); };
    q('.js-stime, .js-nt, .js-slt', timeBig);
    q('.js-upnext', upNextHTML);
    q('.js-later', laterPanel);
    applyBodyClass();

    if (todayKey() !== lastDay) { lastDay = todayKey(); renderAll(); load(); }
    else if (d.getMinutes() !== lastMinute) {
      lastMinute = d.getMinutes();
      renderBar();
      if (curViewId() === 'nightclock') renderHeader();
      if (lastMinute % 5 === 0 && !sheetOpen && !(sw && sw.on)) renderPages();   // fade past events, move the now line
    }

    // Pin ran out: start counting "untouched" time from now.
    if (pinUntil && now >= pinUntil) { setPin(0); }
    var idle = now - lastInteraction, pinned = pinLeft() > 0;
    if (sheetOpen && idle > 10 * 60000) closeSheet();
    if (settingsOpen && idle > 15 * 60000) hideSettings();
    if (!pinned && !sleeping && !sheetOpen && !settingsOpen && !$('pinPop') && S.idleMode !== 'stay' && idle > S.homeMinutes * 60000) {
      if (idleStart < lastInteraction) {           // just became idle: go to Home (and start rotating from there)
        idleStart = now; lastRotate = now;
        if (view !== 0 || calOff || monthOff) autoView(0);
      } else if (S.idleMode === 'rotate' && nViews() > 1 && now - lastRotate >= S.rotateMinutes * 60000) {
        lastRotate = now;
        autoView((view + 1) % nViews());
      }
    }

    if (sleeping) {
      var st = sunTimes(todayKey());
      if (st.rise && sleepSince < st.rise && now >= st.rise) wake();        // wakes at sunrise
      else if (sleepWant() !== sleepMode) drawSleep();
      else if (lastMinute % 10 === 0 && d.getSeconds() < 10) drawSleep();   // keep the weather line fresh
    }

    // Auto-update: check GitHub for a newer index.html; reload into it once nobody is using the board.
    if (now - lastUpdCheck > UPDATE_MS) checkForUpdate();
    if (pendingUpdate && !sleeping && !sheetOpen && !settingsOpen && idle > 60000 &&
        now - (+(store('updAt') || 0)) > 10 * 60000) {
      store('updAt', now); store('reloadAt', now);
      freshReload();
      return;
    }

    // Self-repair: if Safari froze the page or data is very old, reload it.
    var lastReload = +(store('reloadAt') || 0);
    if (now - loadedAt > 30 * 60000 && now - lastReload > 30 * 60000 && navigator.onLine !== false) { store('reloadAt', now); location.reload(); }
    if (d.getHours() === 3 && store('nightly') !== todayKey()) { store('nightly', todayKey()); store('reloadAt', now); location.reload(); }
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && B) load(); });

  // ================================================================
  //  AUTO-UPDATE
  //  Every 5 minutes, ask GitHub Pages whether index.html has changed (a tiny HEAD request
  //  that reads the file's ETag / Last-Modified stamp). When it has, reload into the new
  //  version with a fresh ?v= in the address so Safari can't serve the old copy from cache.
  //  Nothing to do on GitHub except upload the new index.html.
  // ================================================================
  var UPDATE_MS = 5 * 60000, lastUpdCheck = 0, pendingUpdate = null;
  function freshReload() {
    location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  }
  function checkForUpdate() {
    lastUpdCheck = Date.now();
    if (IN_GAS || window.__MOCK_API || !/^https?:$/.test(location.protocol) || navigator.onLine === false) return;
    var x = new XMLHttpRequest();
    x.open('HEAD', location.pathname + '?check=' + Date.now(), true);
    x.timeout = 20000;
    x.onload = function () {
      if (x.status !== 200) return;
      var stamp = x.getResponseHeader('ETag') || x.getResponseHeader('Last-Modified') || '';
      if (!stamp) return;
      var seen = store('pageStamp');
      store('pageStamp', stamp);
      if (seen && stamp !== seen) pendingUpdate = stamp;   // first check just records the stamp
    };
    x.send();
  }

  // ================================================================
  //  START
  // ================================================================
  function start() {
    var cached = store('board');
    if (cached && cached.settings) { B = cached; S = fixSettings(cached.settings); loadedAt = cached.updated || 0; renderAll(); }
    else renderBar();
    load();
    loadPhotos(function () { if (B) startPhotoTimer(); fillPhotoViews(); });
    setInterval(tick, 10000);
  }
  fitHeight();
  if (window.__MOCK_API) { CFG.key = CFG.key || 'test'; start(); }
  else if (IN_GAS && !CFG.key) {
    google.script.url.getLocation(function (loc) {
      if (loc && loc.parameter && loc.parameter.k) { CFG.key = loc.parameter.k; store('cfg', CFG); start(); }
      else showSetup();
    });
  } else if (!IN_GAS && !CFG.api) showSetup();
  else start();

  window.InkBoard = { load: load, state: function () { return { B: B, view: view, sleeping: sleeping, sheetOpen: sheetOpen, settingsOpen: settingsOpen }; } };
})();
</script>
</body>
</html>
